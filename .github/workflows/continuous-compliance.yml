name: Continuous Compliance-as-Code Pipeline

on:
  schedule:
    # Run daily at midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  dora-audit:
    name: Execute DORA Regulatory Audit Engine
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configure Mock AWS Credentials for CI Test
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-1

      - name: Run DORA Audits
        run: |
          python dora/dora_art9_access_protection_auditor.py || true
          python dora/dora_art11_resilience_checker.py || true
          python dora/dora_art12_backup_auditor.py || true
          python dora/dora_art18_incident_classification_engine.py
          python dora/dora_art28_third_party_register_generator.py

      - name: Upload Compliance Evidence Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dora-compliance-evidence-json
          path: |
            dora_article9_evidence.json
            dora_article11_evidence.json
            dora_article12_evidence.json
            dora_article18_evidence.json
            dora_article28_vendor_register.json
          retention-days: 90
